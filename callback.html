<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting… — Ascent Story</title>
  <meta name="robots" content="noindex">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #090909; color: #eee;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; flex-direction: column; gap: 16px; padding: 16px; }
    .msg { font-size: 15px; color: #999; text-align: center; }
    .error { color: #f87171; }
    a { color: #FC4C02; }
  </style>
</head>
<body>
  <div class="msg" id="msg">Connecting to Strava…</div>
  <script>
    (async () => {
      const msg = document.getElementById('msg');
      const p = new URLSearchParams(location.search);
      const fail = text => { msg.className = 'msg error'; msg.innerHTML = text + ' <a href="/">Back</a>'; };
      if (p.get('error') || !p.get('code')) return fail(p.get('error') === 'access_denied' ? 'Access was denied.' : 'No authorization code received.');
      try {
        // exchanged server-side so the client secret never reaches the browser
        const r = await fetch('/api/strava-token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: p.get('code') }) });
        if (!r.ok) throw new Error('token exchange failed (' + r.status + ')');
        const d = await r.json();
        localStorage.setItem('strava_access_token', d.access_token);
        localStorage.setItem('strava_refresh_token', d.refresh_token);
        localStorage.setItem('strava_expires_at', d.expires_at);
        location.replace('/?connected=1');
      } catch (e) { fail('Could not connect: ' + e.message + '.'); }
    })();
  </script>
</body>
</html>
